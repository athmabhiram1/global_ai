# Global Hackathon — one file, one command, one container.
#
# Run it:
#   docker compose up -d --build
# Open it:
#   Console (Next, primary):       http://localhost:3000
#   Gateway (OpenAI-compatible): http://localhost:8080/v1
#   Sidecar console + API:       http://localhost:8090  (legacy fallback UI at /temp1.html)
# Stop it:
#   docker compose down
#
# API keys come from the environment (or a `.env` file next to this file):
#   OPENAI_API_KEY — real key for live models; "unused" keeps the deterministic
#                    mock provider only. The demo runs fully on the mock.
#   TAVILY_API_KEY — enables live freshness evidence; without it the gateway
#                    still curates, and refresh degrades to `refresh_failed`.
#
# Everything else is baked in: Bifrost gateway + contextcurator.so plugin +
# mock provider + sidecar + UI all run as supervised processes inside the one
# container below. No host Go toolchain, no second terminal, no extra files.
name: global-hackathon

services:
  context-curator:
    build:
      context: .
      dockerfile: Dockerfile
    image: context-curator:dev
    container_name: global-hackathon
    ports:
      - "3000:3000" # Next console (primary)
      - "8080:8080" # Bifrost gateway (OpenAI-compatible)
      - "8090:8090" # Context Curator sidecar API + legacy fallback UI
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-unused}
      MOCK_API_KEY: ${MOCK_API_KEY:-unused}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-unused}
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-dev-setup-token}
      CC_ADMIN_TOKEN: ${CC_ADMIN_TOKEN:-dev-token}
      CC_GATEWAY_TOKEN: ${CC_GATEWAY_TOKEN:-}
      CC_SIDECAR_URL: ${CC_SIDECAR_URL:-http://127.0.0.1:8090}
    volumes:
      - cc-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cc-sidecar", "-check", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6

volumes:
  cc-data:
